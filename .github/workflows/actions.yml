name: FastAPI MongoDB CI/CD

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:

  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          sh ./scripts/test.sh


  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: tests

    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build Backend Image
        run: |
          docker build \
            -f backend/backend.dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-backend:latest \
            ./backend


      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-frontend:latest \
            ./frontend


      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-backend:latest


      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-frontend:latest